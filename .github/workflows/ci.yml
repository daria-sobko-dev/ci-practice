name: Check
on: push
jobs: 
  lint:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
  test: 
    needs: [lint]
    strategy:
      matrix:
         version: [14, 16, 24]
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version }}
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test